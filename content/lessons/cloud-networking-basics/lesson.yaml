title: Cloud networking basics
summary: >-
  IP addresses and CIDR ranges, private networks in the cloud (VPCs), public and private subnets, route tables,
  internet gateways and security groups, built step by step as a small shop network on Floci.
estimatedMinutes: 50
prerequisites:
  - containers
topics:
  - networking
  - vpc
  - cidr
  - subnets
  - route-tables
  - security-groups
labTier: partial_floci
verifiedOn:
  date: "2026-11-05"
  floci: "2.4.0"
certifications:
